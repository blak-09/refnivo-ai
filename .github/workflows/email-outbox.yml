name: E-mail outbox retry

# Retry safety net for the transactional e-mail outbox (docs/PRODUCTION.md §10).
# Vercel's daily cron (vercel.json) is the fallback on the Hobby plan; this
# schedule gives a 15-minute retry loop on any plan. Requires two repository
# secrets: CRON_URL (https://<your-domain>/api/cron/email-outbox) and
# CRON_SECRET (same value as the Vercel environment variable). Skips quietly
# when they are not set.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the outbox dispatcher
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET secrets are not set — nothing to do."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$CRON_URL")
          echo "HTTP $code"; cat /tmp/out.json; echo
          [ "$code" = "200" ]
